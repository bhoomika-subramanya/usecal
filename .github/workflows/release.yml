name: Release

# Trigger: push a version tag  →  git tag v1.0.0 && git push origin v1.0.0
# Or trigger manually from the GitHub Actions tab.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── macOS Apple Silicon ───────────────────────────────────────────
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-arm64

          # ── macOS Intel ──────────────────────────────────────────────────
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macOS-x64

          # ── Windows 64-bit ───────────────────────────────────────────────
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64

          # ── Linux 64-bit ─────────────────────────────────────────────────
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux-x64

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: artifacts/tauri-annotator/src-tauri

      # ── Linux system dependencies ───────────────────────────────────────
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libxtst-dev

      # ── Node dependencies ───────────────────────────────────────────────
      - name: Install Node dependencies
        run: pnpm install

      # ── Generate placeholder icons (idempotent) ─────────────────────────
      - name: Generate icons
        run: node artifacts/tauri-annotator/scripts/generate-icons.cjs

      # ── Build React frontend (BASE_PATH=/ for Tauri's file:// serving) ──
      - name: Build frontend
        working-directory: artifacts/tauri-annotator
        run: pnpm run tauri:build

      # ── Tauri build + GitHub Release ────────────────────────────────────
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing (optional — remove if not signing)
          # macOS: set APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          #        APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD,
          #        APPLE_TEAM_ID in repo secrets
          # Windows: set TAURI_SIGNING_PRIVATE_KEY,
          #          TAURI_SIGNING_PRIVATE_KEY_PASSWORD in repo secrets
        with:
          projectPath: artifacts/tauri-annotator
          tagName: ${{ github.ref_name }}
          releaseName: Universal Annotator ${{ github.ref_name }}
          releaseBody: |
            ## What's new
            See [RELEASE.md](RELEASE.md) for the full changelog.

            ## Install
            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `Universal.Annotator_*_aarch64.dmg` |
            | macOS (Intel)         | `Universal.Annotator_*_x64.dmg` |
            | Windows               | `Universal.Annotator_*_x64-setup.exe` |
            | Linux (AppImage)      | `universal-annotator_*_amd64.AppImage` |
            | Linux (deb)           | `universal-annotator_*_amd64.deb` |
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  # ── Optional: combine macOS targets into a universal binary ─────────────
  # Uncomment if you want a single .dmg that runs on both Intel and Apple Silicon.
  # macos-universal:
