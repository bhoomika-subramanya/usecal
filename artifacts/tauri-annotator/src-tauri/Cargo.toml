[package]
name = "tauri-annotator"
version = "0.1.0"
description = "Universal Annotator — Global Spotlight popup for annotating anything on your desktop"
authors = ["Universal Annotator"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tauri_annotator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tauri-annotator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Platform-specific screenshot deps
[target.'cfg(target_os = "windows")'.dependencies]
screenshots = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
screenshots = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
screenshots = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
