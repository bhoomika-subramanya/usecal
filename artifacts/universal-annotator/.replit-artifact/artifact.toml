kind = "web"
previewPath = "/"
title = "Universal Annotator"
version = "1.0.0"
id = "artifacts/universal-annotator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25080

[services.development]
run = "pnpm --filter @workspace/universal-annotator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/universal-annotator", "run", "build" ]
publicDir = "artifacts/universal-annotator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25080"
BASE_PATH = "/"
